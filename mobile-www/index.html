<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Dare</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #08090d;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.14), transparent 32%),
          linear-gradient(150deg, #08090d 0%, #14141c 48%, #07080b 100%);
      }

      main {
        width: min(100%, 360px);
        display: grid;
        gap: 14px;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: 32px;
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #cbd5e1;
        font-size: 15px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Dare</h1>
      <p>Loading Dare. If this screen remains visible, run Capacitor sync with your hosted app URL.</p>
    </main>
  </body>
</html>
