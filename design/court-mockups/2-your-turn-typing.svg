<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1030"/>
      <stop offset="1" stop-color="#0e0820"/>
    </linearGradient>
    <radialGradient id="youspot" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="0.6" stop-color="#ffd766" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffd766" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redteam2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a6e"/><stop offset="1" stop-color="#b3142b"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe07a"/><stop offset="1" stop-color="#e0a92e"/>
    </linearGradient>
    <filter id="soft2" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="390" height="844" fill="url(#bg2)"/>

  <!-- header -->
  <rect x="0" y="0" width="390" height="78" fill="#0e0820" opacity="0.9"/>
  <text x="20" y="32" fill="#ffd766" font-size="13" letter-spacing="2">⚖ COURT IN SESSION</text>
  <rect x="280" y="16" width="92" height="30" rx="15" fill="#2a1840" stroke="#ff5a6e" stroke-width="1.5"/>
  <text x="326" y="36" text-anchor="middle" fill="#ff8a9a" font-size="16" font-weight="700" font-family="monospace">18:11</text>
  <text x="20" y="60" fill="#e9def7" font-size="13">Round 1 · Opening Statement</text>

  <!-- big spotlight cone -->
  <polygon points="195,90 60,470 330,470" fill="url(#youspot)"/>
  <rect width="390" height="844" fill="url(#youspot)"/>

  <!-- "IT'S YOUR TURN" banner -->
  <g transform="translate(195,128)" filter="url(#glow2)">
    <rect x="-130" y="-22" width="260" height="44" rx="22" fill="#ff5a6e"/>
    <text x="0" y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="800" letter-spacing="1">🎤 IT'S YOUR TURN</text>
    <animateTransform attributeName="transform" type="scale" values="1;1.04;1" dur="1.4s" repeatCount="indefinite" additive="sum"/>
  </g>
  <text x="195" y="172" text-anchor="middle" fill="#ffd766" font-size="12">Make your case. Tag witnesses with @</text>

  <!-- YOU on stage, lit, confident -->
  <g transform="translate(195,250)" filter="url(#glow2)">
    <line x1="0" y1="48" x2="0" y2="104" stroke="#ff7385" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="60" x2="-26" y2="40" stroke="#ff7385" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="60" x2="26" y2="78" stroke="#ff7385" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="104" x2="-18" y2="140" stroke="#ff7385" stroke-width="7" stroke-linecap="round"/>
    <line x1="0" y1="104" x2="18" y2="140" stroke="#ff7385" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="22" r="26" fill="url(#redteam2)" stroke="#fff" stroke-width="3"/>
    <text x="0" y="31" text-anchor="middle" font-size="26">😤</text>
    <!-- raised-hand emphasis -->
    <text x="38" y="34" font-size="18">💥</text>
  </g>
  <text x="195" y="416" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">You (Aakash) · Prosecution</text>

  <!-- live mini bar of audience reactions floating -->
  <text x="120" y="300" font-size="16" opacity="0.8">🔥</text>
  <text x="285" y="330" font-size="16" opacity="0.7">😮</text>
  <text x="300" y="250" font-size="14" opacity="0.6">👀</text>
  <text x="92" y="360" font-size="14" opacity="0.6">😂</text>

  <!-- transcript of what you're saying so far -->
  <g transform="translate(30,448)">
    <rect width="330" height="120" rx="16" fill="#22143c" stroke="#3a2455" filter="url(#soft2)"/>
    <text x="18" y="28" fill="#ff8a9a" font-size="11" font-weight="700">YOUR STATEMENT</text>
    <text x="312" y="28" text-anchor="end" fill="#6c5a8c" font-size="9">🔒 hidden until you send</text>
    <text x="18" y="54" fill="#e9def7" font-size="13">Okay so listen. Rahul SWORE he booked</text>
    <text x="18" y="74" fill="#e9def7" font-size="13">the beach hotel. We get there — nothing.</text>
    <text x="18" y="94" fill="#e9def7" font-size="13">Then he loses the return tickets. I have</text>
    <text x="18" y="114" fill="#e9def7" font-size="13">screenshots. <tspan fill="#7fd6ff" font-weight="700">@Priya</tspan> back me up 👇</text>
  </g>

  <!-- evidence + witness quick actions -->
  <g transform="translate(30,584)">
    <rect x="0" y="0" width="104" height="40" rx="20" fill="#2c1a4a" stroke="#ffd766"/>
    <text x="52" y="25" text-anchor="middle" fill="#ffd766" font-size="12" font-weight="700">📎 Evidence</text>
    <rect x="114" y="0" width="104" height="40" rx="20" fill="#2c1a4a" stroke="#7fd6ff"/>
    <text x="166" y="25" text-anchor="middle" fill="#7fd6ff" font-size="12" font-weight="700">@ Witness</text>
    <rect x="228" y="0" width="102" height="40" rx="20" fill="#2c1a4a" stroke="#9d8bc4"/>
    <text x="279" y="25" text-anchor="middle" fill="#cbb8ec" font-size="12" font-weight="700">🎙 Rest case</text>
  </g>

  <!-- speaking time left ring -->
  <g transform="translate(335,640)">
    <circle r="22" fill="none" stroke="#241440" stroke-width="5"/>
    <circle r="22" fill="none" stroke="#ffd766" stroke-width="5" stroke-linecap="round"
            stroke-dasharray="138" stroke-dashoffset="48" transform="rotate(-90)"/>
    <text x="0" y="5" text-anchor="middle" fill="#ffd766" font-size="13" font-weight="700">0:38</text>
  </g>
  <text x="30" y="652" fill="#9d8bc4" font-size="11">⏳ Your speaking window</text>

  <!-- reveal-on-send hint -->
  <text x="195" y="742" text-anchor="middle" fill="#9d8bc4" font-size="10.5">Nobody sees a word until you SLAM it — then it hits the whole court 💥</text>

  <!-- ACTIVE input bar (unlocked, glowing) -->
  <g transform="translate(0,750)">
    <rect x="0" y="0" width="390" height="94" fill="#0e0820"/>
    <rect x="16" y="20" width="250" height="56" rx="28" fill="#2a1640" stroke="url(#gold2)" stroke-width="2" filter="url(#glow2)"/>
    <text x="36" y="54" fill="#fff" font-size="14">Type your argument…</text>
    <!-- blinking caret -->
    <rect x="150" y="40" width="2" height="20" fill="#ffd766">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <!-- SLAM send -->
    <g filter="url(#glow2)">
      <rect x="276" y="20" width="98" height="56" rx="28" fill="url(#redteam2)" filter="url(#soft2)"/>
      <text x="325" y="46" text-anchor="middle" fill="#fff" font-size="15" font-weight="800">SLAM</text>
      <text x="325" y="63" text-anchor="middle" fill="#ffd9de" font-size="11">⚡ reveal</text>
    </g>
  </g>
</svg>
