<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- ============================================================
       CONCEPT 02 — POP COURT
       Light "pop-social" theme version. Cream canvas, mint/coral/
       cyan/sunshine accents, sticker-like cards, confetti energy.
       Same layout DNA: bench top, two podiums, SLAM composer.
  ============================================================ -->
  <defs>
    <linearGradient id="pcBg" x1="0" y1="0" x2="0" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8ef"/>
      <stop offset="0.48" stop-color="#f2fff8"/>
      <stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>
    <linearGradient id="pcSlam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35e89b"/>
      <stop offset="1" stop-color="#21c7e8"/>
    </linearGradient>
    <g id="pcBody" stroke="#17211d" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="20"/>
      <line x1="0" y1="6" x2="-11" y2="14"/>
      <line x1="0" y1="6" x2="11" y2="14"/>
      <line x1="0" y1="20" x2="-9" y2="33"/>
      <line x1="0" y1="20" x2="9" y2="33"/>
    </g>
    <g id="pcBodyUp" stroke="#17211d" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="20"/>
      <line x1="0" y1="7" x2="-12" y2="-2"/>
      <line x1="0" y1="7" x2="12" y2="-2"/>
      <line x1="0" y1="20" x2="-9" y2="33"/>
      <line x1="0" y1="20" x2="9" y2="33"/>
    </g>
  </defs>

  <rect width="390" height="844" fill="url(#pcBg)"/>

  <!-- confetti -->
  <g opacity="0.85">
    <rect x="52" y="150" width="8" height="8" rx="2" fill="#ffd84d" transform="rotate(20 56 154)"/>
    <rect x="330" y="176" width="8" height="8" rx="2" fill="#ff5f7e" transform="rotate(-16 334 180)"/>
    <circle cx="96" cy="208" r="4" fill="#21c7e8"/>
    <circle cx="304" cy="140" r="4" fill="#23d98e"/>
    <rect x="38" y="300" width="7" height="7" rx="2" fill="#a78bfa" transform="rotate(30 41 303)"/>
    <rect x="346" y="316" width="7" height="7" rx="2" fill="#ffd84d" transform="rotate(-24 349 319)"/>
    <circle cx="200" cy="120" r="3.5" fill="#ff5f7e"/>
  </g>

  <!-- status bar -->
  <text x="30" y="34" fill="#17211d" font-size="13" font-weight="700">9:41</text>
  <rect x="336" y="24" width="22" height="11" rx="3" stroke="#17211d55"/>
  <rect x="338" y="26" width="14" height="7" rx="1.5" fill="#23d98e"/>

  <!-- header -->
  <rect x="16" y="56" width="40" height="40" rx="16" fill="#ffffffd9" stroke="#23d98e2e"/>
  <path d="M42 76 H32 M36 71 l-5 5 5 5" stroke="#61766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="68" y="72" fill="#17211d" font-size="16" font-weight="900">Who ruined the Goa trip? 🏖️</text>
  <text x="68" y="90" fill="#61766e" font-size="11" font-weight="600">Court #42 · 14 friends watching</text>
  <rect x="312" y="58" width="58" height="24" rx="12" fill="#ff5f7e"/>
  <text x="341" y="74" text-anchor="middle" fill="#fff" font-size="10" font-weight="900">● LIVE</text>

  <!-- case sticker card -->
  <g transform="rotate(-1.2 195 132)">
    <rect x="60" y="112" width="270" height="40" rx="20" fill="#fff" stroke="#ffd84d" stroke-width="2"/>
    <text x="195" y="130" text-anchor="middle" fill="#b98900" font-size="9" font-weight="900" letter-spacing="2">TODAY'S CASE</text>
    <text x="195" y="145" text-anchor="middle" fill="#17211d" font-size="12" font-weight="800">The People vs. Rahul 🧳</text>
  </g>

  <!-- ── JUDGE ── -->
  <g transform="translate(195,196)">
    <circle r="19" fill="#ffd84d"/>
    <circle r="16" fill="#fff"/>
    <text y="6" text-anchor="middle" fill="#b98900" font-size="15" font-weight="900">P</text>
    <!-- tiny judge wig curls -->
    <circle cx="-16" cy="-8" r="4" fill="#fff" stroke="#17211d22"/>
    <circle cx="16" cy="-8" r="4" fill="#fff" stroke="#17211d22"/>
    <use href="#pcBody" y="19"/>
    <rect x="-30" y="58" width="60" height="17" rx="8.5" fill="#17211d"/>
    <text y="70" text-anchor="middle" fill="#fff" font-size="9" font-weight="900">Priya 👩‍⚖️</text>
  </g>
  <!-- bench: soft rounded blob -->
  <path d="M116 284 Q195 262 274 284 L274 300 Q195 292 116 300 Z" fill="#ffd84d" opacity="0.9"/>
  <rect x="106" y="298" width="178" height="34" rx="17" fill="#fff" stroke="#ffd84d" stroke-width="2"/>
  <text x="195" y="320" text-anchor="middle" fill="#b98900" font-size="11" font-weight="900" letter-spacing="1.5">🔨 THE BENCH</text>

  <!-- verdict donut + score bubbles -->
  <g transform="translate(195,392)">
    <circle r="34" fill="none" stroke="#e7f0ea" stroke-width="10"/>
    <!-- guilty arc ~57% -->
    <path d="M0 -34 A34 34 0 1 1 -14.5 30.7" fill="none" stroke="#ff5f7e" stroke-width="10" stroke-linecap="round"/>
    <text y="-2" text-anchor="middle" fill="#17211d" font-size="14" font-weight="900">8 : 6</text>
    <text y="14" text-anchor="middle" fill="#61766e" font-size="8" font-weight="800">VOTES</text>
  </g>
  <rect x="52" y="374" width="86" height="30" rx="15" fill="#ff5f7e1c" stroke="#ff5f7e55"/>
  <text x="95" y="393" text-anchor="middle" fill="#ef3f60" font-size="10" font-weight="900">GUILTY 😤</text>
  <rect x="252" y="374" width="86" height="30" rx="15" fill="#21c7e81c" stroke="#21c7e855"/>
  <text x="295" y="393" text-anchor="middle" fill="#0e93b3" font-size="10" font-weight="900">INNOCENT 😇</text>

  <!-- ── podium: accusers (left) ── -->
  <g transform="translate(100,520)">
    <g transform="translate(0,-14)">
      <circle r="18" fill="#ff5f7e"/>
      <circle r="15" fill="#fff"/>
      <text y="5" text-anchor="middle" fill="#ef3f60" font-size="14" font-weight="900">A</text>
      <use href="#pcBodyUp" y="18"/>
    </g>
    <!-- speech bubble -->
    <g transform="rotate(-3 44 -58)">
      <rect x="14" y="-72" width="86" height="30" rx="15" fill="#fff" stroke="#ff5f7e" stroke-width="2"/>
      <path d="M32 -42 l4 9 7 -9 Z" fill="#fff" stroke="#ff5f7e" stroke-width="2"/>
      <text x="57" y="-53" text-anchor="middle" fill="#ef3f60" font-size="10" font-weight="900">OBJECTION!</text>
    </g>
    <g transform="translate(-44,8)">
      <circle r="12" fill="#a78bfa"/><circle r="9.5" fill="#fff"/>
      <text y="4" text-anchor="middle" fill="#7c5cd6" font-size="9" font-weight="900">M</text>
      <use href="#pcBody" y="12" transform="scale(0.7)"/>
    </g>
    <g transform="translate(44,8)">
      <circle r="12" fill="#ffd84d"/><circle r="9.5" fill="#fff"/>
      <text y="4" text-anchor="middle" fill="#b98900" font-size="9" font-weight="900">K</text>
      <use href="#pcBody" y="12" transform="scale(0.7)"/>
    </g>
    <rect x="-64" y="64" width="128" height="44" rx="18" fill="#fff" stroke="#ff5f7e" stroke-width="2"/>
    <rect x="-64" y="64" width="128" height="8" rx="4" fill="#ff5f7e"/>
    <text y="94" text-anchor="middle" fill="#ef3f60" font-size="10" font-weight="900" letter-spacing="2">TEAM ACCUSE</text>
  </g>

  <!-- ── podium: defense (right) ── -->
  <g transform="translate(290,520)">
    <g transform="translate(0,-14)">
      <circle r="18" fill="#21c7e8"/>
      <circle r="15" fill="#fff"/>
      <text y="5" text-anchor="middle" fill="#0e93b3" font-size="14" font-weight="900">R</text>
      <use href="#pcBody" y="18"/>
      <text x="24" y="-16" font-size="14">🥲</text>
    </g>
    <g transform="translate(-44,8)">
      <circle r="12" fill="#23d98e"/><circle r="9.5" fill="#fff"/>
      <text y="4" text-anchor="middle" fill="#07986c" font-size="9" font-weight="900">S</text>
      <use href="#pcBody" y="12" transform="scale(0.7)"/>
    </g>
    <g transform="translate(44,8)">
      <circle r="12" fill="#21c7e8"/><circle r="9.5" fill="#fff"/>
      <text y="4" text-anchor="middle" fill="#0e93b3" font-size="9" font-weight="900">D</text>
      <use href="#pcBody" y="12" transform="scale(0.7)"/>
    </g>
    <rect x="-64" y="64" width="128" height="44" rx="18" fill="#fff" stroke="#21c7e8" stroke-width="2"/>
    <rect x="-64" y="64" width="128" height="8" rx="4" fill="#21c7e8"/>
    <text y="94" text-anchor="middle" fill="#0e93b3" font-size="10" font-weight="900" letter-spacing="2">TEAM DEFEND</text>
  </g>

  <!-- statement card -->
  <g transform="rotate(0.8 195 672)">
    <rect x="20" y="646" width="350" height="66" rx="20" fill="#fff" stroke="#23d98e" stroke-width="2"/>
    <circle cx="46" cy="672" r="14" fill="#ff5f7e"/>
    <circle cx="46" cy="672" r="11" fill="#fff"/>
    <text x="46" y="676" text-anchor="middle" fill="#ef3f60" font-size="10" font-weight="900">A</text>
    <text x="68" y="666" fill="#07986c" font-size="9" font-weight="900" letter-spacing="1.5">AAKASH DROPPED EVIDENCE 📸</text>
    <text x="68" y="684" fill="#17211d" font-size="12" font-weight="700">"Wrong weekend. Blamed the app. Receipts</text>
    <text x="68" y="700" fill="#17211d" font-size="12" font-weight="700">attached." · 😂 12 · 🔥 21 · 😱 7</text>
  </g>

  <!-- composer -->
  <rect x="20" y="732" width="244" height="50" rx="25" fill="#fff" stroke="#23d98e66" stroke-width="2"/>
  <text x="40" y="763" font-size="15">📎</text>
  <text x="66" y="762" fill="#82948d" font-size="13" font-weight="600">Spill your side of the story…</text>
  <rect x="272" y="732" width="98" height="50" rx="25" fill="url(#pcSlam)"/>
  <text x="321" y="763" text-anchor="middle" fill="#08341f" font-size="14" font-weight="900">SLAM 🔨</text>

  <text x="195" y="806" text-anchor="middle" fill="#82948d" font-size="9" font-weight="600">Your statement stays sealed until you slam it 🤫</text>
  <rect x="128" y="822" width="134" height="5" rx="2.5" fill="#17211d33"/>
</svg>
