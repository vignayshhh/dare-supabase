<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, -apple-system, sans-serif">
  <!-- ============================================================
       CONCEPT 06 — STADIUM COURT
       Courtroom as a spectator arena: the trial happens center
       stage while the whole circle sits in curved gallery rows
       of mini stickmen, throwing reactions like a crowd. Betting-
       odds verdict chips, floating emoji, roaring atmosphere.
  ============================================================ -->
  <defs>
    <linearGradient id="scBg" x1="0" y1="0" x2="0" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f0a"/>
      <stop offset="0.5" stop-color="#0a0d0b"/>
      <stop offset="1" stop-color="#050705"/>
    </linearGradient>
    <radialGradient id="scArena" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#facc15" stop-opacity="0.12"/>
      <stop offset="0.7" stop-color="#facc15" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scSlam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <g id="scBody" stroke="#ffffff" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="20"/>
      <line x1="0" y1="6" x2="-11" y2="14"/>
      <line x1="0" y1="6" x2="11" y2="14"/>
      <line x1="0" y1="20" x2="-9" y2="33"/>
      <line x1="0" y1="20" x2="9" y2="33"/>
    </g>
    <g id="scBodyCheer" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="20"/>
      <line x1="0" y1="7" x2="-12" y2="-3"/>
      <line x1="0" y1="7" x2="12" y2="-3"/>
      <line x1="0" y1="20" x2="-9" y2="33"/>
      <line x1="0" y1="20" x2="9" y2="33"/>
    </g>
    <!-- tiny crowd spectator: head + shoulders -->
    <g id="scFan">
      <circle r="7"/>
      <path d="M-8 16 Q0 8 8 16" stroke="#ffffff55" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="390" height="844" fill="url(#scBg)"/>
  <rect width="390" height="620" fill="url(#scArena)"/>

  <!-- status bar -->
  <text x="30" y="34" fill="#fff" font-size="13" font-weight="700">9:41</text>
  <rect x="336" y="24" width="22" height="11" rx="3" stroke="#ffffff66"/>
  <rect x="338" y="26" width="14" height="7" rx="1.5" fill="#4ade80"/>

  <!-- header -->
  <rect x="16" y="54" width="36" height="36" rx="14" fill="#ffffff0a" stroke="#ffffff14"/>
  <path d="M40 72 H30 M34 67 l-5 5 5 5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="70" fill="#fff" font-size="15" font-weight="900">Goa Trip Trial 🏟️</text>
  <text x="64" y="87" fill="#7c8a80" font-size="10" font-weight="600">Main event · Court #42</text>
  <rect x="296" y="54" width="74" height="24" rx="12" fill="#fb718522" stroke="#fb718555"/>
  <circle cx="310" cy="66" r="3.5" fill="#fb7185"/>
  <text x="320" y="70" fill="#fda4af" font-size="10" font-weight="900">14 LIVE</text>

  <!-- odds chips -->
  <rect x="20" y="102" width="170" height="46" rx="14" fill="#fb718514" stroke="#fb718544"/>
  <text x="36" y="121" fill="#fda4af" font-size="9" font-weight="900" letter-spacing="1.5">GUILTY ODDS</text>
  <text x="36" y="140" fill="#fff" font-size="15" font-weight="900">1.4x 😤 <tspan fill="#fda4af" font-size="9">· 8 backers</tspan></text>
  <rect x="200" y="102" width="170" height="46" rx="14" fill="#38bdf814" stroke="#38bdf844"/>
  <text x="216" y="121" fill="#7dd3fc" font-size="9" font-weight="900" letter-spacing="1.5">INNOCENT ODDS</text>
  <text x="216" y="140" fill="#fff" font-size="15" font-weight="900">2.1x 😇 <tspan fill="#7dd3fc" font-size="9">· 6 backers</tspan></text>

  <!-- ── CENTER RING ── -->
  <ellipse cx="195" cy="360" rx="158" ry="120" fill="none" stroke="#facc1526" stroke-width="2"/>
  <ellipse cx="195" cy="360" rx="158" ry="120" fill="#facc15" opacity="0.03"/>
  <ellipse cx="195" cy="428" rx="120" ry="26" fill="#facc15" opacity="0.06"/>

  <!-- judge elevated at top of ring -->
  <g transform="translate(195,242)">
    <circle r="17" fill="#facc15"/>
    <circle r="14" fill="#2a2410"/>
    <text y="5" text-anchor="middle" fill="#facc15" font-size="13" font-weight="900">P</text>
    <use href="#scBody" y="17" transform="scale(0.85)"/>
    <rect x="-52" y="50" width="104" height="18" rx="9" fill="#141a0e" stroke="#facc1544"/>
    <text y="63" text-anchor="middle" fill="#facc15" font-size="9" font-weight="900" letter-spacing="1.5">🔨 JUDGE PRIYA</text>
  </g>

  <!-- accuser mid-ring left, pointing -->
  <g transform="translate(112,368)">
    <circle r="22" fill="#fb7185" opacity="0.25"/>
    <circle r="17" fill="#fb7185"/>
    <circle r="14" fill="#2a1216"/>
    <text y="5" text-anchor="middle" fill="#fda4af" font-size="13" font-weight="900">A</text>
    <g stroke="#ffffff" stroke-opacity="0.9" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="17" x2="0" y2="37"/>
      <line x1="0" y1="23" x2="17" y2="16"/>
      <line x1="0" y1="25" x2="-10" y2="33"/>
      <line x1="0" y1="37" x2="-9" y2="50"/>
      <line x1="0" y1="37" x2="10" y2="49"/>
    </g>
    <rect x="-33" y="56" width="66" height="16" rx="8" fill="#00000080" stroke="#fb718544"/>
    <text y="68" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="900">Aakash 🎤</text>
  </g>

  <!-- accused mid-ring right, defeated -->
  <g transform="translate(278,368)">
    <circle r="17" fill="#38bdf8"/>
    <circle r="14" fill="#0e1f2a"/>
    <text y="5" text-anchor="middle" fill="#7dd3fc" font-size="13" font-weight="900">R</text>
    <g stroke="#ffffff" stroke-opacity="0.75" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="17" x2="0" y2="37"/>
      <line x1="0" y1="24" x2="-10" y2="33"/>
      <line x1="0" y1="24" x2="10" y2="33"/>
      <line x1="0" y1="37" x2="-9" y2="50"/>
      <line x1="0" y1="37" x2="9" y2="50"/>
    </g>
    <text x="24" y="-16" font-size="13">😅</text>
    <rect x="-30" y="56" width="60" height="16" rx="8" fill="#00000080" stroke="#38bdf844"/>
    <text y="68" text-anchor="middle" fill="#fff" font-size="8.5" font-weight="900">Rahul</text>
  </g>

  <!-- mic-drop statement bubble center -->
  <g transform="translate(195,332)">
    <rect x="-64" y="-24" width="128" height="42" rx="12" fill="#101411" stroke="#4ade8055"/>
    <path d="M-30 18 l6 10 8 -10 Z" fill="#101411" stroke="#4ade8055"/>
    <text y="-6" text-anchor="middle" fill="#86efac" font-size="8" font-weight="900" letter-spacing="1.5">LIVE STATEMENT</text>
    <text y="10" text-anchor="middle" fill="#fff" font-size="10.5" font-weight="700">"THREE alarms? Show us ONE."</text>
  </g>

  <!-- floating crowd reactions -->
  <text x="70" y="290" font-size="15" opacity="0.9">😂</text>
  <text x="322" y="300" font-size="13" opacity="0.8">🍿</text>
  <text x="88" y="452" font-size="13" opacity="0.8">🔥</text>
  <text x="308" y="446" font-size="15" opacity="0.9">💀</text>
  <text x="195" y="470" text-anchor="middle" font-size="12" opacity="0.7">👏 👏 👏</text>

  <!-- ── GALLERY: curved crowd rows of mini stickmen ── -->
  <path d="M8 560 Q195 500 382 560" stroke="#ffffff0f" stroke-width="1.5" fill="none"/>
  <g fill="#fb7185">
    <g transform="translate(48,548)"><use href="#scFan"/></g>
    <g transform="translate(88,534)"><use href="#scFan" fill="#c084fc"/></g>
    <g transform="translate(128,524)"><use href="#scFan" fill="#4ade80"/></g>
    <g transform="translate(168,518)"><use href="#scFan" fill="#facc15"/></g>
    <g transform="translate(208,517)"><use href="#scFan" fill="#38bdf8"/></g>
    <g transform="translate(248,522)"><use href="#scFan" fill="#fb7185"/></g>
    <g transform="translate(288,532)"><use href="#scFan" fill="#c084fc"/></g>
    <g transform="translate(328,545)"><use href="#scFan" fill="#4ade80"/></g>
  </g>
  <path d="M-4 606 Q195 540 394 606" stroke="#ffffff0f" stroke-width="1.5" fill="none"/>
  <g>
    <g transform="translate(30,592)"><use href="#scFan" fill="#38bdf8"/></g>
    <g transform="translate(72,576)"><use href="#scFan" fill="#facc15"/></g>
    <g transform="translate(114,564)"><use href="#scFan" fill="#fb7185"/></g>
    <g transform="translate(156,557)"><use href="#scFan" fill="#4ade80"/></g>
    <g transform="translate(198,555)"><use href="#scFan" fill="#c084fc"/></g>
    <g transform="translate(240,559)"><use href="#scFan" fill="#38bdf8"/></g>
    <g transform="translate(282,568)"><use href="#scFan" fill="#facc15"/></g>
    <g transform="translate(324,580)"><use href="#scFan" fill="#fb7185"/></g>
    <g transform="translate(360,594)"><use href="#scFan" fill="#4ade80"/></g>
  </g>
  <text x="195" y="632" text-anchor="middle" fill="#5b6b60" font-size="8.5" font-weight="900" letter-spacing="3">THE GALLERY · YOUR WHOLE CIRCLE IS WATCHING</text>

  <!-- crowd reaction bar -->
  <g font-size="14" text-anchor="middle">
    <rect x="20" y="648" width="62" height="34" rx="17" fill="#ffffff08" stroke="#ffffff14"/>
    <text x="51" y="670">😂 34</text>
    <rect x="90" y="648" width="62" height="34" rx="17" fill="#ffffff08" stroke="#ffffff14"/>
    <text x="121" y="670">🍿 18</text>
    <rect x="160" y="648" width="62" height="34" rx="17" fill="#fb718522" stroke="#fb718555"/>
    <text x="191" y="670">🔥 52</text>
    <rect x="230" y="648" width="62" height="34" rx="17" fill="#ffffff08" stroke="#ffffff14"/>
    <text x="261" y="670">💀 27</text>
    <rect x="300" y="648" width="70" height="34" rx="17" fill="#facc1522" stroke="#facc1555"/>
    <text x="335" y="670">🔨 9</text>
  </g>

  <!-- pick-a-side + composer -->
  <rect x="20" y="700" width="112" height="48" rx="24" fill="#fb718518" stroke="#fb7185" stroke-width="2"/>
  <text x="76" y="723" text-anchor="middle" fill="#fda4af" font-size="10" font-weight="900">BACK GUILTY</text>
  <text x="76" y="738" text-anchor="middle" fill="#fda4af" font-size="9" font-weight="700">1.4x 😤</text>
  <rect x="140" y="700" width="112" height="48" rx="24" fill="#38bdf818" stroke="#38bdf866"/>
  <text x="196" y="723" text-anchor="middle" fill="#7dd3fc" font-size="10" font-weight="900">BACK INNOCENT</text>
  <text x="196" y="738" text-anchor="middle" fill="#7dd3fc" font-size="9" font-weight="700">2.1x 😇</text>
  <rect x="260" y="700" width="110" height="48" rx="24" fill="url(#scSlam)"/>
  <text x="315" y="723" text-anchor="middle" fill="#04170c" font-size="11" font-weight="900">HYPE IT 📣</text>
  <text x="315" y="738" text-anchor="middle" fill="#04170c" font-size="9" font-weight="800">shout to the crowd</text>

  <text x="195" y="778" text-anchor="middle" fill="#7c8a80" font-size="9" font-weight="600">Verdict at the final bell · winners take bragging rights 🏆</text>
  <rect x="128" y="822" width="134" height="5" rx="2.5" fill="#ffffff33"/>
</svg>
