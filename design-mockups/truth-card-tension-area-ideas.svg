<svg width="1800" height="1640" viewBox="0 0 1800 1640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#07120b"/>
      <stop offset="0.52" stop-color="#050806"/>
      <stop offset="1" stop-color="#020302"/>
    </linearGradient>
    <linearGradient id="truth" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="lie" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7f1d1d"/>
      <stop offset="1" stop-color="#3a0b0b"/>
    </linearGradient>
    <radialGradient id="greenMist" cx="50%" cy="42%" r="62%">
      <stop stop-color="#4ade8028"/>
      <stop offset="0.58" stop-color="#4ade8008"/>
      <stop offset="1" stop-color="#00000000"/>
    </radialGradient>
    <style>
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 44px; font-weight: 950; fill: #fff; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 21px; font-weight: 650; fill: #94a3b8; }
      .idea { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 21px; font-weight: 950; fill: #d7ffe6; letter-spacing: 1.4px; }
      .tiny { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; font-weight: 850; fill: #94a3b8; letter-spacing: 1px; }
      .small { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 15px; font-weight: 760; fill: #a7b7ab; }
      .copy { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 17px; font-weight: 780; fill: #dbe7dd; }
      .big { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 28px; font-weight: 950; fill: #fff; }
      .num { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 36px; font-weight: 950; fill: #fff; }
      .chip { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 15px; font-weight: 950; fill: #061006; }
