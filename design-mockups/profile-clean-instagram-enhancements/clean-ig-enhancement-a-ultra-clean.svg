      <rect x="700" width="58" height="58" rx="16" fill="rgba(74,222,128,.12)" stroke="rgba(74,222,128,.3)"/>
      <path d="M729 16 C744 22 749 22 764 16 L764 30 C764 45 752 54 746 57 C740 54 729 45 729 30 Z" fill="none" stroke="#4ade80" stroke-width="4"/>
