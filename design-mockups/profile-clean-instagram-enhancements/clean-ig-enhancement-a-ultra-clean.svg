      <circle cx="86" cy="86" r="66" fill="#07100b"/>
      <circle cx="86" cy="72" r="31" fill="#d7ffe6"/>
      <path d="M38 132 C50 101 122 101 134 132" fill="#d7ffe6"/>
      <circle cx="148" cy="144" r="19" fill="url(#green)" stroke="#050806" stroke-width="6"/>
      <path d="M139 144 L146 151 L158 136" fill="none" stroke="#061006" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

