      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <style>
      .h1{fill:#fff;font:900 38px Inter,Arial,sans-serif;letter-spacing:-.02em}
      .sub{fill:#94a3b8;font:700 22px Inter,Arial,sans-serif}
      .name{fill:#fff;font:850 28px Inter,Arial,sans-serif}
      .body{fill:#fff;font:760 24px Inter,Arial,sans-serif}
      .muted{fill:#94a3b8;font:700 19px Inter,Arial,sans-serif}
      .tiny{fill:#64748b;font:900 14px Inter,Arial,sans-serif;letter-spacing:2.2px}
      .dark{fill:#061006;font:900 19px Inter,Arial,sans-serif}
    </style>
  </defs>
  <rect width="1080" height="1440" fill="url(#bg)"/>
  <circle cx="540" cy="-42" r="370" fill="#4ade80" opacity=".09"/>
  <circle cx="940" cy="250" r="260" fill="#38bdf8" opacity=".055"/>
  <text x="72" y="96" class="h1">Clean IG Enhancement A</text>
  <text x="72" y="132" class="sub">Ultra-clean profile header</text>

  <g transform="translate(90 190)" filter="url(#shadow)">
    <rect width="900" height="960" rx="56" fill="#020403" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
    <rect x="28" y="28" width="844" height="904" rx="42" fill="#050806" stroke="rgba(255,255,255,.08)" stroke-width="2"/>
    <g transform="translate(74 82)">
