      <stop offset="0" stop-color="#17351f"/><stop offset="42%" stop-color="#0a0f0a"/><stop offset="100%" stop-color="#030403"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#111a14" stop-opacity=".98"/><stop offset="1" stop-color="#060907" stop-opacity=".99"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#22c55e"/></linearGradient>
