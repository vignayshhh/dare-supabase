      <stop offset="0.35" stop-color="#67e8f9" stop-opacity="0.09"/>
      <stop offset="0.62" stop-color="#f43f5e" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
