      <stop offset="0.34" stop-color="#10130f"/>
      <stop offset="0.68" stop-color="#090b10"/>
      <stop offset="1" stop-color="#030405"/>
    </linearGradient>
    <radialGradient id="stageGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1100 -80) rotate(90) scale(920 1500)">
