      .desc { font: 650 14px Inter, SF Pro Display, Arial, sans-serif; fill: #9ca3af; letter-spacing: 0; }
      .tag { font: 900 11px Inter, SF Pro Display, Arial, sans-serif; fill: #86efac; letter-spacing: 1.6px; }
      .inkRound { stroke: #111; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .inkSharp { stroke: #060606; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .thinInk { stroke: #111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .neon { stroke: #4ade80; stroke-width: 3; stroke-linecap: round; }
      .cyan { stroke: #22d3ee; stroke-width: 3; stroke-linecap: round; }
      .pink { stroke: #fb7185; stroke-width: 3; stroke-linecap: round; }
