      .sub { font: 650 20px Inter, SF Pro Display, Arial, sans-serif; fill: #a5adba; letter-spacing: 0; }
      .name { font: 920 23px Inter, SF Pro Display, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .desc { font: 650 14px Inter, SF Pro Display, Arial, sans-serif; fill: #9ca3af; letter-spacing: 0; }
      .tag { font: 900 11px Inter, SF Pro Display, Arial, sans-serif; fill: #86efac; letter-spacing: 1.6px; }
      .darkLine { stroke: #111; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .heavyLine { stroke: #080808; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thinLine { stroke: #111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .green { stroke: #4ade80; stroke-width: 3; stroke-linecap: round; }
      .blue { stroke: #38bdf8; stroke-width: 3; stroke-linecap: round; }
