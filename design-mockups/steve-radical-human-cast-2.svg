      <stop offset="0.35" stop-color="#4ade80" stop-opacity="0.12"/>
      <stop offset="0.66" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
