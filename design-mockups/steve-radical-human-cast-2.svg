<svg width="2200" height="1380" viewBox="0 0 2200 1380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="2200" y2="1380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#040504"/>
      <stop offset="0.36" stop-color="#14110e"/>
      <stop offset="0.72" stop-color="#071016"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1080 -60) rotate(90) scale(940 1500)">
