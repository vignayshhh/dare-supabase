<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1680" viewBox="0 0 1400 1680">
  <defs>
    <radialGradient id="pageGlow" cx="50%" cy="0%" r="78%">
      <stop offset="0%" stop-color="#17442c"/>
      <stop offset="42%" stop-color="#07100d"/>
      <stop offset="100%" stop-color="#020403"/>
    </radialGradient>
    <linearGradient id="cardBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102019"/>
      <stop offset="54%" stop-color="#07100c"/>
      <stop offset="100%" stop-color="#020504"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.07"/>
    </linearGradient>
    <linearGradient id="greenLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="46%" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="72%" stop-color="#38bdf8" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="truthPill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="cyanGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.48"/>
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#4ade80" flood-opacity="0.08"/>
    </filter>
    <filter id="smallGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#4ade80" flood-opacity="0.55"/>
    </filter>
    <style>
      .bg { fill: url(#pageGlow); }
      .title { fill: #f8fafc; font: 900 34px Inter, Arial, sans-serif; letter-spacing: 0; }
      .subtitle { fill: #8fa99b; font: 650 17px Inter, Arial, sans-serif; }
      .label { fill: #86efac; font: 900 13px Inter, Arial, sans-serif; letter-spacing: 2.2px; }
      .small { fill: #94a3b8; font: 700 13px Inter, Arial, sans-serif; }
      .name { fill: #f8fafc; font: 850 19px Inter, Arial, sans-serif; }
      .handle { fill: #9fb3a8; font: 650 13px Inter, Arial, sans-serif; }
      .question { fill: #ffffff; font: 900 26px Inter, Arial, sans-serif; letter-spacing: 0; }
      .caption { fill: #b8cfc3; font: 700 15px Inter, Arial, sans-serif; }
      .card { fill: url(#cardBase); stroke: rgba(255,255,255,0.10); stroke-width: 1; filter: url(#softShadow); }
      .glass { fill: url(#glass); stroke: rgba(255,255,255,0.15); stroke-width: 1; }
      .darkGlass { fill: rgba(5,12,9,0.74); stroke: rgba(255,255,255,0.12); stroke-width: 1; }
      .line { fill: url(#greenLine); }
    </style>
  </defs>

  <rect class="bg" width="1400" height="1680"/>
  <text x="70" y="82" class="title">Truth Card Top Section - UI Variations</text>
  <text x="70" y="114" class="subtitle">Dark premium glass, green/cyan edge light, only the header/top question area.</text>

  <!-- Variation 1 -->
  <g transform="translate(70 160)">
    <rect class="card" width="590" height="410" rx="34"/>
    <circle cx="500" cy="16" r="140" fill="#4ade80" opacity="0.11"/>
    <rect x="40" y="28" width="510" height="82" rx="27" class="glass"/>
    <rect x="86" y="38" width="1" height="62" fill="#ffffff" opacity="0.08"/>
    <circle cx="72" cy="69" r="27" fill="#0f2319" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="72" cy="69" r="22" fill="#4ade80" opacity="0.82"/>
    <text x="114" y="63" class="name">Maya asked Jay</text>
    <text x="114" y="85" class="handle">@maya -> @jay</text>
    <rect x="392" y="48" width="124" height="42" rx="21" fill="url(#truthPill)" filter="url(#smallGlow)"/>
    <text x="421" y="75" fill="#061006" font-family="Inter,Arial" font-size="14" font-weight="900">TRUTH</text>
    <rect x="40" y="132" width="510" height="146" rx="26" class="darkGlass"/>
    <rect x="70" y="154" width="450" height="2" rx="1" class="line"/>
    <text x="70" y="198" class="label">TRUTH OR LIE</text>
    <text x="70" y="238" class="question">I deleted the message before</text>
    <text x="70" y="272" class="question">they could read it.</text>
    <text x="40" y="350" class="caption">1. Clean Glass Header - closest to current app style</text>
  </g>

  <!-- Variation 2 -->
  <g transform="translate(740 160)">
    <rect class="card" width="590" height="410" rx="34"/>
    <rect x="0" y="0" width="590" height="6" fill="url(#greenLine)" opacity="0.86"/>
    <path d="M44 54 C156 18 264 18 376 54 C435 73 486 76 546 58 L546 132 C452 155 364 151 281 130 C190 107 112 108 44 132 Z" fill="url(#cyanGlass)" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="104" cy="92" r="34" fill="#0b1813" stroke="#4ade80" stroke-opacity="0.42" stroke-width="2"/>
    <circle cx="104" cy="92" r="27" fill="#4ade80" opacity="0.86"/>
    <circle cx="158" cy="92" r="34" fill="#07120e" stroke="#38bdf8" stroke-opacity="0.32" stroke-width="2"/>
    <circle cx="158" cy="92" r="27" fill="#38bdf8" opacity="0.62"/>
    <text x="214" y="85" class="name">Ava asked Jay</text>
    <text x="214" y="111" class="handle">tap twice to open conversation</text>
    <rect x="44" y="166" width="502" height="112" rx="28" fill="#0a1410" stroke="#4ade80" stroke-opacity="0.20"/>
    <text x="78" y="207" class="label">CONFESSION CHECK</text>
    <text x="78" y="249" class="question">I still remember their password.</text>
    <text x="40" y="350" class="caption">2. Wave Pair Header - more social and relationship-focused</text>
  </g>

  <!-- Variation 3 -->
  <g transform="translate(70 610)">
    <rect class="card" width="590" height="410" rx="34"/>
    <rect x="38" y="36" width="514" height="58" rx="29" fill="#07100d" stroke="#ffffff" stroke-opacity="0.11"/>
    <rect x="52" y="50" width="116" height="30" rx="15" fill="#4ade80" opacity="0.94"/>
    <text x="78" y="70" fill="#031006" font-family="Inter,Arial" font-size="12" font-weight="950">LIVE</text>
    <text x="190" y="72" class="small">Truth prompt from close friends</text>
    <circle cx="492" cy="65" r="8" fill="#4ade80" filter="url(#smallGlow)"/>
    <rect x="56" y="120" width="478" height="180" rx="32" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.14)"/>
    <circle cx="112" cy="172" r="35" fill="#102119" stroke="#ffffff" stroke-opacity="0.16"/>
    <circle cx="112" cy="172" r="28" fill="#4ade80" opacity="0.76"/>
    <text x="164" y="165" class="name">Nikhil</text>
    <text x="164" y="190" class="handle">sent a truth prompt</text>
    <text x="84" y="246" class="question">Would Jay lie to protect Maya?</text>
    <text x="40" y="350" class="caption">3. Live Status Header - fastest scan, app-like and modern</text>
  </g>

  <!-- Variation 4 -->
  <g transform="translate(740 610)">
    <rect class="card" width="590" height="410" rx="34"/>
    <rect x="44" y="34" width="502" height="236" rx="34" fill="rgba(4,10,8,0.72)" stroke="rgba(255,255,255,0.11)"/>
    <path d="M72 88 H230" stroke="#4ade80" stroke-opacity="0.66" stroke-width="2"/>
    <path d="M360 88 H518" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="296" cy="88" r="44" fill="#07130f" stroke="#ffffff" stroke-opacity="0.13"/>
    <circle cx="296" cy="88" r="34" fill="#4ade80" opacity="0.8"/>
    <text x="204" y="166" text-anchor="middle" class="name">Sana</text>
    <text x="388" y="166" text-anchor="middle" class="name">Riya</text>
    <text x="296" y="204" text-anchor="middle" class="label">TRUTH BETWEEN US</text>
    <text x="92" y="248" class="question">One of us still has screenshots.</text>
    <text x="40" y="350" class="caption">4. Center Medallion Header - premium, ceremonial, dramatic</text>
  </g>

  <!-- Variation 5 -->
  <g transform="translate(70 1060)">
    <rect class="card" width="590" height="410" rx="34"/>
    <rect x="36" y="30" width="518" height="82" rx="24" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.12)"/>
    <text x="62" y="63" class="label">TRUTH CARD</text>
    <text x="62" y="92" class="small">anonymous-feeling prompt header</text>
    <rect x="396" y="48" width="118" height="40" rx="20" fill="#07120e" stroke="#4ade80" stroke-opacity="0.38"/>
    <text x="421" y="74" fill="#86efac" font-family="Inter,Arial" font-size="13" font-weight="900">PRIVATE</text>
    <rect x="58" y="142" width="474" height="130" rx="28" fill="url(#glass)" stroke="rgba(255,255,255,0.16)"/>
    <text x="88" y="190" class="question">I acted okay, but I was not.</text>
    <text x="88" y="226" class="handle">Reveal emotional truths without making the top heavy.</text>
    <text x="40" y="350" class="caption">5. Anonymous Glass Prompt - quiet, premium, text-first</text>
  </g>

  <!-- Variation 6 -->
  <g transform="translate(740 1060)">
    <rect class="card" width="590" height="410" rx="34"/>
    <circle cx="90" cy="82" r="48" fill="#07120d" stroke="#4ade80" stroke-opacity="0.28"/>
    <circle cx="90" cy="82" r="38" fill="#4ade80" opacity="0.78"/>
    <rect x="150" y="44" width="248" height="34" rx="17" fill="#0b1711" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="174" y="67" class="small">Maya asked Jay</text>
    <rect x="150" y="88" width="150" height="34" rx="17" fill="url(#truthPill)" opacity="0.96"/>
    <text x="181" y="111" fill="#051008" font-family="Inter,Arial" font-size="13" font-weight="950">ANSWER</text>
    <rect x="36" y="154" width="518" height="124" rx="32" fill="rgba(7,16,12,0.84)" stroke="rgba(74,222,128,0.20)"/>
    <path d="M70 179 H520" stroke="url(#greenLine)" stroke-width="2"/>
    <text x="70" y="225" class="question">Does Jay think Maya noticed?</text>
    <text x="40" y="350" class="caption">6. Action Header - compact CTA, best for swipe decks</text>
  </g>

  <text x="70" y="1532" fill="#d9fbe7" font-family="Inter,Arial" font-size="24" font-weight="900">Recommendation</text>
  <text x="70" y="1570" fill="#9fb3a8" font-family="Inter,Arial" font-size="18" font-weight="650">Use 1 or 6 for the main reel because they keep the card readable. Use 4 for special/high-stakes truth prompts.</text>
</svg>
