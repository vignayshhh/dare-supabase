<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <radialGradient id="pageBg" cx="50%" cy="-8%" r="88%">
      <stop offset="0" stop-color="#17351f"/>
      <stop offset="42%" stop-color="#07100b"/>
      <stop offset="100%" stop-color="#020403"/>
    </radialGradient>
    <linearGradient id="passport" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#18251d"/>
      <stop offset="0.48" stop-color="#0d1712"/>
      <stop offset="1" stop-color="#061009"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="0.54" stop-color="#d7ffe6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="lines" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(16)">
      <path d="M0 0 L0 28" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="30" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <style>
      .title { fill:#ffffff; font:900 38px Inter, Arial, sans-serif; letter-spacing:-0.02em; }
      .subtitle { fill:#94a3b8; font:700 22px Inter, Arial, sans-serif; }
      .body { fill:#ffffff; font:800 25px Inter, Arial, sans-serif; }
      .muted { fill:#94a3b8; font:700 20px Inter, Arial, sans-serif; }
      .tiny { fill:#64748b; font:900 15px Inter, Arial, sans-serif; letter-spacing:2.5px; }
      .chip { fill:#86efac; font:900 15px Inter, Arial, sans-serif; letter-spacing:2.4px; }
      .dark { fill:#061006; font:900 20px Inter, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1080" height="1440" fill="url(#pageBg)"/>
  <circle cx="250" cy="40" r="310" fill="#4ade80" opacity="0.09"/>
  <circle cx="918" cy="260" r="260" fill="#38bdf8" opacity="0.075"/>

  <text x="72" y="96" class="title">Variation 2</text>
  <text x="72" y="132" class="subtitle">Dare Passport Header</text>

  <g transform="translate(90 190)" filter="url(#softShadow)">
    <rect width="900" height="960" rx="56" fill="#020403" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <rect x="26" y="26" width="848" height="908" rx="42" fill="#050806" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <rect x="26" y="26" width="848" height="908" rx="42" fill="url(#lines)" opacity="0.55"/>

    <g transform="translate(68 72)">
      <text x="0" y="28" class="body">Profile</text>
      <rect x="642" y="-10" width="136" height="48" rx="24" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.08)"/>
      <text x="710" y="20" text-anchor="middle" class="tiny">MENU</text>
    </g>

    <g transform="translate(68 150)">
      <rect width="778" height="386" rx="42" fill="url(#passport)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
      <rect width="778" height="386" rx="42" fill="url(#lines)" opacity="0.8"/>
      <path d="M0 128 C158 86 276 108 428 60 C548 22 648 38 778 4 L778 0 L0 0 Z" fill="#4ade80" opacity="0.075"/>
      <path d="M0 386 C196 316 318 360 474 306 C604 262 674 270 778 226 L778 386 Z" fill="#38bdf8" opacity="0.055"/>

      <rect x="28" y="28" width="186" height="42" rx="21" fill="rgba(74,222,128,0.12)" stroke="rgba(74,222,128,0.24)"/>
      <text x="121" y="56" text-anchor="middle" class="chip">DARE PASSPORT</text>

      <g transform="translate(42 108)">
        <rect width="150" height="184" rx="34" fill="#07100b" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
        <circle cx="75" cy="78" r="58" fill="url(#ring)"/>
        <circle cx="75" cy="78" r="48" fill="#07100b"/>
        <circle cx="75" cy="64" r="23" fill="#d7ffe6"/>
        <path d="M38 122 C48 96 102 96 112 122" fill="#d7ffe6"/>
        <rect x="26" y="148" width="98" height="18" rx="9" fill="rgba(255,255,255,0.08)"/>
      </g>

      <g transform="translate(236 112)">
        <text x="0" y="34" class="title">Aarav Sharma</text>
        <text x="0" y="72" class="muted">@aarav.dares</text>
        <text x="0" y="120" class="body" font-size="22">Dare streaks, proof wins, close-friend stories.</text>
        <rect x="0" y="152" width="184" height="58" rx="29" fill="url(#green)"/>
        <text x="92" y="188" text-anchor="middle" class="dark">Edit profile</text>
        <rect x="204" y="152" width="138" height="58" rx="29" fill="rgba(255,255,255,0.055)" stroke="rgba(255,255,255,0.1)"/>
        <text x="273" y="188" text-anchor="middle" class="body" font-size="20">Share</text>
      </g>

      <g transform="translate(42 318)">
        <rect width="142" height="44" rx="22" fill="rgba(74,222,128,0.1)" stroke="rgba(74,222,128,0.22)"/>
        <text x="71" y="29" text-anchor="middle" class="chip">PROOF</text>
        <rect x="160" width="160" height="44" rx="22" fill="rgba(56,189,248,0.09)" stroke="rgba(56,189,248,0.18)"/>
        <text x="240" y="29" text-anchor="middle" class="chip">TRUTH</text>
        <rect x="338" width="170" height="44" rx="22" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.08)"/>
        <text x="423" y="29" text-anchor="middle" class="chip">CIRCLE</text>
      </g>
    </g>

    <g transform="translate(68 574)">
      <rect width="778" height="104" rx="34" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <text x="70" y="43" class="title" font-size="34">48</text><text x="66" y="76" class="tiny">POSTS</text>
      <text x="232" y="43" class="title" font-size="34">31</text><text x="224" y="76" class="tiny">DARES</text>
      <text x="394" y="43" class="title" font-size="34">19</text><text x="384" y="76" class="tiny">TRUTHS</text>
      <text x="558" y="43" class="title" font-size="34">126</text><text x="552" y="76" class="tiny">FRIENDS</text>
    </g>

    <g transform="translate(68 720)">
      <rect width="778" height="76" rx="38" fill="#07100b" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
      <rect x="8" y="8" width="250" height="60" rx="30" fill="url(#green)"/>
      <text x="133" y="47" text-anchor="middle" class="dark">Posts</text>
      <text x="389" y="47" text-anchor="middle" class="muted">Truths</text>
      <text x="648" y="47" text-anchor="middle" class="muted">Dares</text>
    </g>

    <g transform="translate(68 846)">
      <rect width="374" height="74" rx="28" fill="rgba(74,222,128,0.08)" stroke="rgba(74,222,128,0.18)"/>
      <text x="28" y="47" class="body" font-size="22">Proof Verified</text>
      <rect x="404" width="374" height="74" rx="28" fill="rgba(56,189,248,0.07)" stroke="rgba(56,189,248,0.16)"/>
      <text x="432" y="47" class="body" font-size="22">Truth Answered</text>
    </g>
  </g>
</svg>
