<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <radialGradient id="pageBg" cx="50%" cy="-8%" r="88%">
      <stop offset="0" stop-color="#17351f"/>
      <stop offset="38%" stop-color="#0a0f0a"/>
      <stop offset="100%" stop-color="#030403"/>
    </radialGradient>
    <linearGradient id="surface" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#111a14" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#060907" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="0.58" stop-color="#d7ffe6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.46"/>
    </filter>
    <style>
      .title { fill:#ffffff; font:900 38px Inter, Arial, sans-serif; letter-spacing:-0.02em; }
      .subtitle { fill:#94a3b8; font:700 22px Inter, Arial, sans-serif; }
      .body { fill:#ffffff; font:750 25px Inter, Arial, sans-serif; }
      .muted { fill:#94a3b8; font:700 20px Inter, Arial, sans-serif; }
      .tiny { fill:#64748b; font:900 15px Inter, Arial, sans-serif; letter-spacing:2.5px; }
      .greenText { fill:#86efac; font:900 15px Inter, Arial, sans-serif; letter-spacing:2.3px; }
      .dark { fill:#061006; font:900 20px Inter, Arial, sans-serif; }
