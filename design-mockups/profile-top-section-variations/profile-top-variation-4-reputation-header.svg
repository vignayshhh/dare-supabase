      .body { fill:#ffffff; font:800 25px Inter, Arial, sans-serif; }
      .muted { fill:#94a3b8; font:700 20px Inter, Arial, sans-serif; }
      .tiny { fill:#64748b; font:900 15px Inter, Arial, sans-serif; letter-spacing:2.5px; }
      .chip { fill:#86efac; font:900 15px Inter, Arial, sans-serif; letter-spacing:2.4px; }
      .dark { fill:#061006; font:900 20px Inter, Arial, sans-serif; }
    </style>
