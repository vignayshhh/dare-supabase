<svg width="1800" height="1280" viewBox="0 0 1800 1280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pageGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 -80) rotate(90) scale(760 1180)">
      <stop stop-color="#4ADE80" stop-opacity="0.18"/>
      <stop offset="0.44" stop-color="#22D3EE" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#030403" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#060806"/>
      <stop offset="0.48" stop-color="#0A0F0A"/>
      <stop offset="1" stop-color="#020403"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#121A14" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#060907" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="deepPanel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0D1511"/>
      <stop offset="1" stop-color="#040706"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#86EFAC"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="cyanEmerald" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <radialGradient id="spotFloor" cx="50%" cy="45%" r="62%">
      <stop stop-color="#4ADE80" stop-opacity="0.32"/>
      <stop offset="0.62" stop-color="#0EA5E9" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#030403" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000000" flood-opacity="0.48"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="greenGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .title { font-family: Inter, Arial, sans-serif; fill: #FFFFFF; font-weight: 950; letter-spacing: 0; }
      .label { font-family: Inter, Arial, sans-serif; fill: #FFFFFF; font-weight: 900; letter-spacing: 0; }
      .muted { font-family: Inter, Arial, sans-serif; fill: #94A3B8; font-weight: 760; letter-spacing: 0; }
      .tiny { font-family: Inter, Arial, sans-serif; fill: #86EFAC; font-weight: 950; letter-spacing: 1.8px; }
      .cyanTiny { font-family: Inter, Arial, sans-serif; fill: #A5F3FC; font-weight: 950; letter-spacing: 1.8px; }
      .body { font-family: Inter, Arial, sans-serif; fill: #D7FFE6; font-weight: 850; letter-spacing: 0; }
      .caption { font-family: Inter, Arial, sans-serif; fill: #64748B; font-weight: 800; letter-spacing: 0; }
      .screen { fill: url(#screenBg); stroke: rgba(255,255,255,0.08); stroke-width: 1.2; }
      .glass { fill: rgba(255,255,255,0.045); stroke: rgba(255,255,255,0.09); stroke-width: 1; }
      .shine { stroke: rgba(134,239,172,0.72); stroke-width: 1; }
    </style>
  </defs>

  <rect width="1800" height="1280" fill="#030403"/>
  <rect width="1800" height="1280" fill="url(#pageGlow)"/>

  <text x="72" y="76" class="title" font-size="42">Assumptions Game SVG Directions</text>
  <text x="72" y="116" class="muted" font-size="18">Four fundamentally different game formats, using the app's dark emerald, cyan glow, glass panels, and Daily Challenge-style cinematic surfaces.</text>

  <!-- Variation 1: Spotlight Read -->
  <g transform="translate(72 184)">
    <text x="0" y="-34" class="label" font-size="26">1. Spotlight Read</text>
    <text x="0" y="-8" class="muted" font-size="15">Format: one player makes a read, the subject is put on stage, the other guesses if the read lands.</text>
    <rect x="0" y="0" width="390" height="760" rx="46" class="screen" filter="url(#shadow)"/>
    <rect x="0" y="0" width="390" height="760" rx="46" fill="url(#pageGlow)" opacity="0.72"/>

    <rect x="18" y="26" width="354" height="88" rx="32" fill="url(#panel)" stroke="rgba(255,255,255,0.08)" filter="url(#softShadow)"/>
    <line x1="62" y1="27" x2="328" y2="27" class="shine"/>
    <circle cx="60" cy="70" r="24" class="glass"/>
    <path d="M68 62L58 70L68 78" stroke="#94A3B8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="64" class="tiny" font-size="10">ASSUMPTIONS</text>
    <text x="98" y="91" class="label" font-size="23">Spotlight Read</text>

    <g transform="translate(18 140)">
      <rect width="354" height="414" rx="38" fill="url(#deepPanel)" stroke="rgba(255,255,255,0.08)" filter="url(#softShadow)"/>
      <path d="M128 0H226L312 304H42L128 0Z" fill="#86EFAC" opacity="0.13"/>
      <path d="M146 0H208L270 300H84L146 0Z" fill="#22D3EE" opacity="0.055"/>
      <ellipse cx="177" cy="294" rx="122" ry="42" fill="url(#spotFloor)"/>
      <path d="M18 316C74 338 278 338 336 316" stroke="#4ADE80" stroke-opacity="0.48" stroke-width="3" stroke-linecap="round"/>

      <circle cx="177" cy="180" r="60" fill="#08120D" stroke="rgba(134,239,172,0.36)" stroke-width="2"/>
      <circle cx="177" cy="162" r="21" fill="#D7FFE6"/>
      <path d="M130 220C140 190 214 190 224 220" stroke="#D7FFE6" stroke-width="18" stroke-linecap="round"/>
      <circle cx="124" cy="118" r="4" fill="#86EFAC" filter="url(#greenGlow)"/>
      <circle cx="241" cy="108" r="3.5" fill="#22D3EE" opacity="0.8"/>
      <circle cx="276" cy="224" r="3.5" fill="#86EFAC" opacity="0.7"/>

      <rect x="37" y="32" width="280" height="72" rx="28" fill="rgba(0,0,0,0.48)" stroke="rgba(255,255,255,0.08)"/>
      <text x="58" y="60" class="caption" font-size="13">@vignesh assumes</text>
      <text x="58" y="88" class="body" font-size="21">Neethin loves drama</text>

      <rect x="54" y="342" width="246" height="44" rx="22" fill="rgba(74,222,128,0.10)" stroke="rgba(74,222,128,0.28)"/>
      <text x="97" y="370" class="tiny" font-size="12">WAITING FOR THE REVEAL</text>
    </g>

    <g transform="translate(18 582)">
      <rect width="354" height="110" rx="32" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" filter="url(#softShadow)"/>
      <text x="24" y="34" class="tiny" font-size="10">ACTION STYLE</text>
      <text x="24" y="64" class="label" font-size="19">Caught me / Not even close</text>
      <text x="24" y="88" class="muted" font-size="13">Feels like a public callout, not a poll.</text>
    </g>
  </g>

  <!-- Variation 2: Mind Vault -->
  <g transform="translate(510 184)">
    <text x="0" y="-34" class="label" font-size="26">2. Mind Vault</text>
    <text x="0" y="-8" class="muted" font-size="15">Format: decode the subject's answer by unlocking a vault. The reveal feels like cracking a secret.</text>
    <rect x="0" y="0" width="390" height="760" rx="46" class="screen" filter="url(#shadow)"/>
    <rect x="0" y="0" width="390" height="760" rx="46" fill="url(#pageGlow)" opacity="0.7"/>

    <rect x="18" y="26" width="354" height="88" rx="32" fill="url(#panel)" stroke="rgba(255,255,255,0.08)" filter="url(#softShadow)"/>
    <line x1="62" y1="27" x2="328" y2="27" class="shine"/>
    <circle cx="60" cy="70" r="24" class="glass"/>
    <path d="M68 62L58 70L68 78" stroke="#94A3B8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="64" class="cyanTiny" font-size="10">ASSUMPTIONS</text>
    <text x="98" y="91" class="label" font-size="23">Mind Vault</text>

    <g transform="translate(18 140)">
      <rect width="354" height="456" rx="40" fill="url(#deepPanel)" stroke="rgba(255,255,255,0.08)" filter="url(#softShadow)"/>
      <circle cx="177" cy="214" r="138" fill="rgba(34,211,238,0.045)"/>
      <circle cx="177" cy="214" r="116" stroke="rgba(34,211,238,0.22)" stroke-width="18"/>
      <circle cx="177" cy="214" r="91" stroke="rgba(134,239,172,0.22)" stroke-width="3" stroke-dasharray="8 10"/>
      <circle cx="177" cy="214" r="68" fill="#040706" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
      <circle cx="177" cy="214" r="36" fill="rgba(74,222,128,0.14)" stroke="rgba(134,239,172,0.48)" stroke-width="2"/>
      <circle cx="177" cy="214" r="9" fill="#D7FFE6" filter="url(#greenGlow)"/>

      <path d="M134 214H220" stroke="#86EFAC" stroke-width="5" stroke-linecap="round"/>
      <path d="M177 171V257" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
      <path d="M122 144C148 120 206 114 235 144" stroke="#86EFAC" stroke-opacity="0.36" stroke-width="4" stroke-linecap="round"/>
      <path d="M120 284C150 310 205 314 236 284" stroke="#22D3EE" stroke-opacity="0.28" stroke-width="4" stroke-linecap="round"/>

      <rect x="44" y="34" width="266" height="76" rx="28" fill="rgba(0,0,0,0.44)" stroke="rgba(255,255,255,0.08)"/>
      <text x="68" y="64" class="caption" font-size="13">Locked assumption</text>
      <text x="68" y="92" class="body" font-size="20">He pretends not to care</text>

      <rect x="46" y="364" width="126" height="46" rx="23" fill="rgba(74,222,128,0.12)" stroke="rgba(74,222,128,0.3)"/>
      <text x="81" y="392" class="tiny" font-size="11">UNLOCK</text>
      <rect x="182" y="364" width="126" height="46" rx="23" fill="rgba(34,211,238,0.10)" stroke="rgba(34,211,238,0.24)"/>
      <text x="216" y="392" class="cyanTiny" font-size="11">MISS</text>
    </g>

    <g transform="translate(18 624)">
      <rect width="354" height="68" rx="28" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" filter="url(#softShadow)"/>
      <text x="24" y="29" class="tiny" font-size="10">BEST FOR</text>
      <text x="24" y="52" class="muted" font-size="13">A secretive, high-suspense answer reveal.</text>
    </g>
  </g>

  <!-- Variation 3: Rumor Radar -->
  <g transform="translate(948 184)">
    <text x="0" y="-34" class="label" font-size="26">3. Rumor Radar</text>
    <text x="0" y="-8" class="muted" font-size="15">Format: assumption becomes a social signal. Players track whether the read is hot or completely cold.</text>
    <rect x="0" y="0" width="390" height="760" rx="46" class="screen" filter="url(#shadow)"/>
    <rect x="0" y="0" width="390" height="760" rx="46" fill="url(#pageGlow)" opacity="0.7"/>

    <rect x="18" y="26" width="354" height="88" rx="32" fill="url(#panel)" stroke="rgba(255,255,255,0.08)" filter="url(#softShadow)"/>
    <line x1="62" y1="27" x2="328" y2="27" class="shine"/>
    <circle cx="60" cy="70" r="24" class="glass"/>
    <path d="M68 62L58 70L68 78" stroke="#94A3B8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="64" class="tiny" font-size="10">ASSUMPTIONS</text>
    <text x="98" y="91" class="label" font-size="23">Rumor Radar</text>

    <g transform="translate(18 140)">
      <rect width="354" height="420" rx="40" fill="url(#deepPanel)" stroke="rgba(255,255,255,0.08)" filter="url(#softShadow)"/>
      <circle cx="177" cy="206" r="132" fill="rgba(74,222,128,0.04)"/>
      <circle cx="177" cy="206" r="112" stroke="rgba(134,239,172,0.16)" stroke-width="2"/>
      <circle cx="177" cy="206" r="82" stroke="rgba(34,211,238,0.18)" stroke-width="2"/>
      <circle cx="177" cy="206" r="52" stroke="rgba(134,239,172,0.18)" stroke-width="2"/>
      <path d="M177 206L286 152A122 122 0 0 1 299 206Z" fill="#4ADE80" opacity="0.16"/>
      <path d="M177 86V326M57 206H297" stroke="rgba(255,255,255,0.08)" stroke-width="1.4"/>
      <circle cx="246" cy="158" r="9" fill="#86EFAC" filter="url(#greenGlow)"/>
      <circle cx="116" cy="239" r="7" fill="#22D3EE" opacity="0.8"/>
      <circle cx="220" cy="272" r="5" fill="#F59E0B" opacity="0.8"/>

      <rect x="38" y="32" width="278" height="78" rx="28" fill="rgba(0,0,0,0.46)" stroke="rgba(255,255,255,0.08)"/>
      <text x="62" y="62" class="caption" font-size="13">Signal detected</text>
      <text x="62" y="91" class="body" font-size="20">Neethin is secretly jealous</text>

      <g transform="translate(42 330)">
        <rect width="270" height="50" rx="25" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.08)"/>
        <rect x="7" y="7" width="154" height="36" rx="18" fill="url(#hot)"/>
        <text x="53" y="31" fill="#041006" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="950">HOT READ</text>
        <text x="195" y="31" class="caption" font-size="12">Cold</text>
      </g>
    </g>

    <g transform="translate(18 588)">
      <rect width="354" height="104" rx="32" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" filter="url(#softShadow)"/>
      <text x="24" y="34" class="tiny" font-size="10">ACTION STYLE</text>
      <text x="24" y="63" class="label" font-size="19">Hot read / Cold read</text>
      <text x="24" y="86" class="muted" font-size="13">More playful, less serious, good for fast rounds.</text>
    </g>
  </g>

  <!-- Variation 4: Receipt Desk -->
  <g transform="translate(1386 184)">
    <text x="0" y="-34" class="label" font-size="26">4. Receipt Desk</text>
    <text x="0" y="-8" class="muted" font-size="15">Format: the assumption is treated like evidence. Reveal stamps the table with a final verdict.</text>
    <rect x="0" y="0" width="390" height="760" rx="46" class="screen" filter="url(#shadow)"/>
    <rect x="0" y="0" width="390" height="760" rx="46" fill="url(#pageGlow)" opacity="0.7"/>

    <rect x="18" y="26" width="354" height="88" rx="32" fill="url(#panel)" stroke="rgba(255,255,255,0.08)" filter="url(#softShadow)"/>
    <line x1="62" y1="27" x2="328" y2="27" class="shine"/>
    <circle cx="60" cy="70" r="24" class="glass"/>
    <path d="M68 62L58 70L68 78" stroke="#94A3B8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="64" class="tiny" font-size="10">ASSUMPTIONS</text>
    <text x="98" y="91" class="label" font-size="23">Receipt Desk</text>

    <g transform="translate(18 140)">
      <rect width="354" height="454" rx="40" fill="url(#deepPanel)" stroke="rgba(255,255,255,0.08)" filter="url(#softShadow)"/>
      <rect x="42" y="52" width="208" height="284" rx="24" fill="#0F1711" stroke="rgba(255,255,255,0.09)" transform="rotate(-5 42 52)" filter="url(#softShadow)"/>
      <rect x="112" y="88" width="198" height="270" rx="24" fill="#0A110D" stroke="rgba(134,239,172,0.16)" transform="rotate(6 112 88)" filter="url(#softShadow)"/>
      <rect x="66" y="78" width="180" height="34" rx="17" fill="rgba(74,222,128,0.10)" stroke="rgba(74,222,128,0.22)" transform="rotate(-5 66 78)"/>
      <rect x="136" y="118" width="142" height="12" rx="6" fill="rgba(255,255,255,0.12)" transform="rotate(6 136 118)"/>
      <rect x="136" y="146" width="128" height="12" rx="6" fill="rgba(255,255,255,0.085)" transform="rotate(6 136 146)"/>
      <rect x="136" y="174" width="154" height="12" rx="6" fill="rgba(255,255,255,0.085)" transform="rotate(6 136 174)"/>
      <circle cx="246" cy="284" r="58" fill="rgba(74,222,128,0.10)" stroke="rgba(134,239,172,0.30)" stroke-width="3"/>
      <text x="246" y="276" text-anchor="middle" class="tiny" font-size="11">READ</text>
      <text x="246" y="299" text-anchor="middle" class="tiny" font-size="11">CONFIRMED</text>
      <path d="M204 328C230 348 270 348 296 328" stroke="#86EFAC" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>

      <rect x="38" y="354" width="278" height="58" rx="26" fill="rgba(0,0,0,0.42)" stroke="rgba(255,255,255,0.08)"/>
      <text x="62" y="378" class="caption" font-size="12">The claim</text>
      <text x="62" y="401" class="body" font-size="18">He started the rumor first</text>
    </g>

    <g transform="translate(18 622)">
      <rect width="354" height="70" rx="30" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" filter="url(#softShadow)"/>
      <text x="24" y="30" class="tiny" font-size="10">BEST FOR</text>
      <text x="24" y="53" class="muted" font-size="13">A bigger, satisfying final verdict moment.</text>
    </g>
  </g>

  <g transform="translate(72 1012)">
    <rect width="1704" height="188" rx="36" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.08)" filter="url(#softShadow)"/>
    <text x="34" y="52" class="label" font-size="26">Design read</text>
    <text x="34" y="91" class="muted" font-size="17">Strongest format: Spotlight Read. It feels the most social, dramatic, and app-native because the subject becomes the moment.</text>
    <text x="34" y="127" class="muted" font-size="17">Most game-like format: Mind Vault. It gives Assumptions a unique mechanic without copying This Or That's split screen.</text>
    <text x="34" y="163" class="muted" font-size="17">Best build direction: use Spotlight for the main game screen, Mind Vault for the sync/lock phase, and Receipt Desk for the reveal animation.</text>
  </g>
</svg>
