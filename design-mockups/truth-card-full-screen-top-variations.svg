<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2580" viewBox="0 0 1400 2580">
  <defs>
    <radialGradient id="pageBg" cx="50%" cy="0%" r="84%">
      <stop offset="0%" stop-color="#153d29"/>
      <stop offset="44%" stop-color="#07100d"/>
      <stop offset="100%" stop-color="#020403"/>
    </radialGradient>
    <linearGradient id="phoneBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#09140f"/>
      <stop offset="52%" stop-color="#050b08"/>
      <stop offset="100%" stop-color="#020403"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="0%" r="86%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.16"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.055"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="edgeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="48%" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="72%" stop-color="#38bdf8" stop-opacity="0.48"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#000" flood-opacity="0.52"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#4ade80" flood-opacity="0.07"/>
    </filter>
    <filter id="dotGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#4ade80" flood-opacity="0.62"/>
    </filter>
    <style>
      .pageTitle { fill:#f8fafc; font:900 34px Inter,Arial,sans-serif; }
      .pageSub { fill:#9fb3a8; font:650 17px Inter,Arial,sans-serif; }
      .phone { fill:#020403; stroke:#102118; stroke-width:2; filter:url(#shadow); }
      .screen { fill:url(#phoneBg); }
      .card { fill:#06100c; stroke:rgba(255,255,255,0.08); stroke-width:1; }
      .topLabel { fill:#a7f3d0; font:900 10px Inter,Arial,sans-serif; letter-spacing:2px; }
      .name { fill:#f8fafc; font:850 15px Inter,Arial,sans-serif; }
      .handle { fill:#8fa99b; font:650 11px Inter,Arial,sans-serif; }
      .questionLabel { fill:#86efac; font:900 10px Inter,Arial,sans-serif; letter-spacing:1.5px; }
      .question { fill:#fff; font:850 19px Inter,Arial,sans-serif; }
      .answer { fill:#f2fff7; font:800 17px Inter,Arial,sans-serif; }
      .muted { fill:#94a3b8; font:650 12px Inter,Arial,sans-serif; }
      .caption { fill:#d9fbe7; font:850 17px Inter,Arial,sans-serif; }
      .small { fill:#9fb3a8; font:650 12px Inter,Arial,sans-serif; }
    </style>
  </defs>

  <rect width="1400" height="2580" fill="url(#pageBg)"/>
  <text x="70" y="78" class="pageTitle">Truth Card Full Screen Top Variations</text>
  <text x="70" y="112" class="pageSub">Default message-style body kept consistent. Only the top section changes.</text>

