        <path d="M161 139 C174 130 191 129 206 138" stroke="#4ade80" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
        <circle cx="132" cy="150" r="4" fill="#86efac" filter="url(#greenGlow)"/>
        <circle cx="184" cy="150" r="4" fill="#86efac" filter="url(#greenGlow)"/>
        <path d="M118 195 C143 209 174 207 194 192" stroke="#111" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
        <path d="M51 146 H260" stroke="#67e8f9" stroke-width="2" opacity="0.42"/>
        <path d="M51 164 H260" stroke="#67e8f9" stroke-width="2" opacity="0.2"/>
