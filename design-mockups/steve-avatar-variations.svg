<svg width="1800" height="1160" viewBox="0 0 1800 1160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pageGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 -80) rotate(90) scale(720 1180)">
      <stop stop-color="#1ed76e" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#0ea5e9" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#020403" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151b17"/>
      <stop offset="1" stop-color="#070a08"/>
    </linearGradient>
    <linearGradient id="avatarGlass" x1="0" y1="0" x2="0" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f2b25"/>
      <stop offset="0.55" stop-color="#0c1110"/>
      <stop offset="1" stop-color="#050706"/>
    </linearGradient>
    <linearGradient id="skinA" x1="0" y1="0" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d8b19a"/>
