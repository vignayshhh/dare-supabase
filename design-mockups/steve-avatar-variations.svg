    <text x="34" y="386" class="tag">MOST MYSTERIOUS</text>
  </g>

  <defs>
    <linearGradient id="greenLine1" x1="44" y1="0" x2="416" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ade80" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4ade80"/>
