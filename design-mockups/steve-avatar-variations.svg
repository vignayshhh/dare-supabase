    <linearGradient id="skinB" x1="0" y1="0" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0c9a8"/>
      <stop offset="1" stop-color="#9b604a"/>
    </linearGradient>
    <linearGradient id="skinC" x1="0" y1="0" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b9856f"/>
      <stop offset="1" stop-color="#5c352f"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
