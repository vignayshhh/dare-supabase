    <text x="34" y="58" class="label">6. Anonymous Steve</text>
    <text x="34" y="84" class="note">Human, but more mythic. Good if Steve should feel rare.</text>
    <g transform="translate(80 116)">
      <circle cx="150" cy="150" r="126" fill="#06100b" stroke="#1f5134" stroke-width="2"/>
      <g clip-path="url(#avatarClip)">
