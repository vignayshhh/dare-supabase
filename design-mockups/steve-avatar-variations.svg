        <circle cx="181" cy="149" r="4" fill="#07100b"/>
        <path d="M132 192 C148 206 171 204 185 190" stroke="#321711" stroke-width="4" stroke-linecap="round"/>
        <path d="M63 102 C94 70 122 52 150 50 C190 47 223 71 242 105" stroke="#4ade80" stroke-width="2" opacity="0.28"/>
