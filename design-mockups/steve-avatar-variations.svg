    <style>
      .title { font: 900 54px Inter, SF Pro Display, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .sub { font: 600 19px Inter, SF Pro Display, Arial, sans-serif; fill: #94a3b8; letter-spacing: 0; }
      .label { font: 850 24px Inter, SF Pro Display, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .note { font: 650 15px Inter, SF Pro Display, Arial, sans-serif; fill: #94a3b8; letter-spacing: 0; }
      .tag { font: 850 12px Inter, SF Pro Display, Arial, sans-serif; fill: #86efac; letter-spacing: 1.8px; }
      .tiny { font: 850 11px Inter, SF Pro Display, Arial, sans-serif; fill: #030705; letter-spacing: 1.2px; }
      .faceLine { stroke: #20100e; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.72; }
      .scan { stroke: #67e8f9; stroke-width: 1.5; opacity: 0.34; }
      .ring { stroke: #4ade80; stroke-width: 4; opacity: 0.76; }
