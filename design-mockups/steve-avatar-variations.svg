  </g>

  <g transform="translate(620 650)" filter="url(#softShadow)">
    <rect width="460" height="430" rx="34" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.09"/>
    <text x="34" y="58" class="label">5. Party Room Steve</text>
    <text x="34" y="84" class="note">More social, fun, and meme-able. Less mysterious.</text>
    <g transform="translate(80 116)">
