<svg width="1900" height="1260" viewBox="0 0 1900 1260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1900" y2="1260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#030504"/>
      <stop offset="0.42" stop-color="#11120d"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="ambient" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 -60) rotate(90) scale(860 1220)">
