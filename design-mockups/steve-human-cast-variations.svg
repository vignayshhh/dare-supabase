      .desc { font: 650 15px Inter, SF Pro Display, Arial, sans-serif; fill: #9ca3af; letter-spacing: 0; }
      .tag { font: 900 12px Inter, SF Pro Display, Arial, sans-serif; fill: #86efac; letter-spacing: 1.7px; }
      .line { stroke: #1b0f0d; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.8; }
      .thin { stroke: #111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .sketch { stroke: #050505; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
