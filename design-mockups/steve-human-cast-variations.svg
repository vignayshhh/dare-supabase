    <linearGradient id="skin1" x1="0" y1="0" x2="0" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f3c49d"/>
      <stop offset="1" stop-color="#9a5a42"/>
    </linearGradient>
    <linearGradient id="skin2" x1="0" y1="0" x2="0" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d7aa87"/>
      <stop offset="1" stop-color="#654138"/>
