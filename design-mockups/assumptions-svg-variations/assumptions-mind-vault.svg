<svg width="420" height="620" viewBox="0 0 420 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#050806"/>
      <stop offset="0.5" stop-color="#07100C"/>
      <stop offset="1" stop-color="#020403"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0D1511"/>
      <stop offset="1" stop-color="#040706"/>
    </linearGradient>
    <radialGradient id="glowBg" cx="50%" cy="8%" r="76%">
      <stop stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="0.48" stop-color="#4ADE80" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#030403" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label{font-family:Inter,Arial,sans-serif;fill:#fff;font-weight:950}
      .muted{font-family:Inter,Arial,sans-serif;fill:#94A3B8;font-weight:800}
      .tiny{font-family:Inter,Arial,sans-serif;fill:#A5F3FC;font-weight:950;letter-spacing:1.8px}
      .body{font-family:Inter,Arial,sans-serif;fill:#D7FFE6;font-weight:900}
    </style>
  </defs>
  <rect width="420" height="620" rx="42" fill="url(#bg)"/>
  <rect width="420" height="620" rx="42" fill="url(#glowBg)"/>
  <rect x="24" y="24" width="372" height="86" rx="32" fill="url(#panel)" stroke="rgba(255,255,255,0.08)" filter="url(#shadow)"/>
  <line x1="70" y1="25" x2="350" y2="25" stroke="rgba(134,239,172,0.72)"/>
  <text x="48" y="60" class="tiny" font-size="11">ASSUMPTIONS</text>
  <text x="48" y="90" class="label" font-size="24">Mind Vault</text>
  <g transform="translate(24 138)">
    <rect width="372" height="410" rx="40" fill="url(#panel)" stroke="rgba(255,255,255,0.08)" filter="url(#shadow)"/>
    <circle cx="186" cy="206" r="138" fill="rgba(34,211,238,0.045)"/>
    <circle cx="186" cy="206" r="116" stroke="rgba(34,211,238,0.22)" stroke-width="18"/>
    <circle cx="186" cy="206" r="92" stroke="rgba(134,239,172,0.22)" stroke-width="3" stroke-dasharray="8 10"/>
    <circle cx="186" cy="206" r="69" fill="#040706" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <circle cx="186" cy="206" r="37" fill="rgba(74,222,128,0.14)" stroke="rgba(134,239,172,0.48)" stroke-width="2"/>
    <circle cx="186" cy="206" r="9" fill="#D7FFE6" filter="url(#glow)"/>
    <path d="M142 206H230" stroke="#86EFAC" stroke-width="5" stroke-linecap="round"/>
    <path d="M186 162V250" stroke="#22D3EE" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <rect x="44" y="34" width="284" height="78" rx="28" fill="rgba(0,0,0,0.44)" stroke="rgba(255,255,255,0.08)"/>
    <text x="70" y="64" class="muted" font-size="13">Locked assumption</text>
    <text x="70" y="94" class="body" font-size="20">He pretends not to care</text>
    <rect x="52" y="330" width="128" height="46" rx="23" fill="rgba(74,222,128,0.12)" stroke="rgba(74,222,128,0.3)"/>
    <text x="86" y="358" fill="#86EFAC" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="950" letter-spacing="1.8">UNLOCK</text>
    <rect x="192" y="330" width="128" height="46" rx="23" fill="rgba(34,211,238,0.10)" stroke="rgba(34,211,238,0.24)"/>
    <text x="226" y="358" class="tiny" font-size="11">MISS</text>
  </g>
  <text x="210" y="586" text-anchor="middle" class="muted" font-size="14">Secret answer. Decode phase. Vault reveal.</text>
</svg>
