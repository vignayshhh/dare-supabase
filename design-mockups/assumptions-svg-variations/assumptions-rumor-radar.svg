<svg width="420" height="620" viewBox="0 0 420 620" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#060806"/><stop offset="0.52" stop-color="#0A0F0A"/><stop offset="1" stop-color="#020403"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0D1511"/><stop offset="1" stop-color="#040706"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B"/><stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <radialGradient id="glowBg" cx="50%" cy="8%" r="76%">
      <stop stop-color="#4ADE80" stop-opacity="0.16"/><stop offset="0.48" stop-color="#22D3EE" stop-opacity="0.08"/><stop offset="1" stop-color="#030403" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label{font-family:Inter,Arial,sans-serif;fill:#fff;font-weight:950}
      .muted{font-family:Inter,Arial,sans-serif;fill:#94A3B8;font-weight:800}
      .tiny{font-family:Inter,Arial,sans-serif;fill:#86EFAC;font-weight:950;letter-spacing:1.8px}
      .body{font-family:Inter,Arial,sans-serif;fill:#D7FFE6;font-weight:900}
    </style>
  </defs>
  <rect width="420" height="620" rx="42" fill="url(#bg)"/>
  <rect width="420" height="620" rx="42" fill="url(#glowBg)"/>
  <rect x="24" y="24" width="372" height="86" rx="32" fill="url(#panel)" stroke="rgba(255,255,255,0.08)" filter="url(#shadow)"/>
  <line x1="70" y1="25" x2="350" y2="25" stroke="rgba(134,239,172,0.72)"/>
  <text x="48" y="60" class="tiny" font-size="11">ASSUMPTIONS</text>
  <text x="48" y="90" class="label" font-size="24">Rumor Radar</text>
  <g transform="translate(24 138)">
    <rect width="372" height="390" rx="40" fill="url(#panel)" stroke="rgba(255,255,255,0.08)" filter="url(#shadow)"/>
    <circle cx="186" cy="196" r="132" fill="rgba(74,222,128,0.04)"/>
    <circle cx="186" cy="196" r="112" stroke="rgba(134,239,172,0.16)" stroke-width="2"/>
    <circle cx="186" cy="196" r="82" stroke="rgba(34,211,238,0.18)" stroke-width="2"/>
    <circle cx="186" cy="196" r="52" stroke="rgba(134,239,172,0.18)" stroke-width="2"/>
    <path d="M186 196L295 142A122 122 0 0 1 308 196Z" fill="#4ADE80" opacity="0.16"/>
    <path d="M186 76V316M66 196H306" stroke="rgba(255,255,255,0.08)" stroke-width="1.4"/>
    <circle cx="255" cy="148" r="9" fill="#86EFAC" filter="url(#glow)"/>
    <circle cx="126" cy="229" r="7" fill="#22D3EE" opacity="0.8"/>
    <circle cx="230" cy="262" r="5" fill="#F59E0B" opacity="0.8"/>
    <rect x="40" y="32" width="292" height="78" rx="28" fill="rgba(0,0,0,0.46)" stroke="rgba(255,255,255,0.08)"/>
    <text x="66" y="62" class="muted" font-size="13">Signal detected</text>
    <text x="66" y="92" class="body" font-size="20">Neethin is secretly jealous</text>
    <rect x="50" y="318" width="272" height="50" rx="25" fill="rgba(255,255,255,0.045)" stroke="rgba(255,255,255,0.08)"/>
    <rect x="57" y="325" width="156" height="36" rx="18" fill="url(#hot)"/>
    <text x="102" y="349" fill="#041006" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="950">HOT READ</text>
    <text x="248" y="349" fill="#64748B" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="850">Cold</text>
  </g>
  <text x="210" y="574" text-anchor="middle" class="muted" font-size="14">Fast social signal. Hot read vs cold read.</text>
</svg>
